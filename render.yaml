# Blueprint Render : crée l'API (Docker) en un clic. La base PostgreSQL est hébergée sur Neon.
# Dashboard Render > New > Blueprint > choisir ce dépôt.
services:
  - type: web
    name: riot-stats-api
    runtime: docker
    plan: free
    dockerContext: ./riot-stats-back
    dockerfilePath: ./riot-stats-back/Dockerfile
    healthCheckPath: /sante
    envVars:
      - key: DATABASE_URL
        sync: false # chaîne de connexion Neon (avec -pooler), à saisir dans le dashboard
      - key: RIOT_API_KEY
        sync: false # à saisir dans le dashboard, jamais dans le dépôt
      - key: CORS_ORIGINS
        sync: false # ex : https://riot-stats.vercel.app
