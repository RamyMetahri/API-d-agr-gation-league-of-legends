# Lance l'API + PostgreSQL en local : docker compose up --build
# Prérequis : riot-stats-api/.env avec RIOT_API_KEY (voir riot-stats-api/.env.example)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riot
      POSTGRES_PASSWORD: riot
      POSTGRES_DB: riot_stats
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riot -d riot_stats"]
      interval: 3s
      retries: 10

  api:
    build: ./riot-stats-api
    env_file: ./riot-stats-api/.env
    environment:
      # Remplace le DATABASE_URL du .env : ici la base est le conteneur "db"
      DATABASE_URL: postgresql://riot:riot@db:5432/riot_stats
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
